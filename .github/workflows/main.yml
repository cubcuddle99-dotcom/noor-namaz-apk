name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Check secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "KEYSTORE_BASE64 / KEYSTORE_PASSWORD secret নেই"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/noor.p12"

      - name: Install
        run: npm install

      - name: Web files -> www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png adhan.mp3 www/
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html

      - name: Add Android + patch
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/noor.p12
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/noor.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk noor.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: নূর v${{ github.run_number }}
          files: noor.apk
          make_latest: true
