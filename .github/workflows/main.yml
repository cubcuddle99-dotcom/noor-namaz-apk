name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noor-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: npm install

      - name: Web files -> www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png adhan.mp3 www/

      - name: Add Android + patch
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: noor-apk/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: noor-apk/android/app/build/outputs/apk/debug/app-debug.apk
