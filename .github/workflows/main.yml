name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write   # Release বানাতে ও APK যুক্ত করতে লাগে

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      # index.html-এর APP_BUILD সংখ্যাটাই Release-এর ট্যাগ (v49 ইত্যাদি) হবে — তাই দুটো সবসময় মিলে যায়
      - name: Read APP_BUILD
        run: |
          N=$(grep -oE "APP_BUILD='[0-9]+'" index.html | grep -oE '[0-9]+' | head -1)
          if [ -z "$N" ]; then echo "::error::index.html-এ APP_BUILD='সংখ্যা' পাওয়া যায়নি"; exit 1; fi
          echo "APP_BUILD=$N" >> "$GITHUB_ENV"
          echo "APP_BUILD = $N"

      # স্থায়ী সই (Google লগইনের জন্য SHA-1 প্রতিবার একই থাকতে হয়)
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/noor.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/noor.keystore" >> "$GITHUB_ENV"
            echo "স্থায়ী keystore পাওয়া গেছে"
          else
            echo "::warning::KEYSTORE_BASE64 secret সেট করা নেই। সাময়িক debug সই ব্যবহার হবে (Google লগইন কাজ করবে না, আর আগের অ্যাপের ওপর আপডেটও বসবে না)।"
          fi

      - name: Install
        run: npm install

      - name: Web files -> www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png adhan.mp3 www/

      - name: Add Android + patch
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../noor-namaz.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../noor-namaz.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: noor-namaz.apk

      # নিজে নিজে Release তৈরি: ট্যাগ = v + APP_BUILD, সাথে APK
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_BUILD }}
          name: Noor Namaz v${{ env.APP_BUILD }}
          files: noor-namaz.apk
          make_latest: true
